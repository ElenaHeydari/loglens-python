[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loglens"
version = "1.0.0"
description = "A CLI tool for analyzing timestamped application logs"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
loglens = "loglens.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]